name: CI/CD Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v3

      # 2️⃣ Install Docker Compose (v2 plugin)
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # 3️⃣ Create temporary .env from GitHub secrets BEFORE Maven build
      - name: Create temporary .env
        run: |
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=5432" >> .env

      # 4️⃣ Set up JDK 21 + Maven cache
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      # 5️⃣ Build Maven project (with .env variables exported)
      - name: Build JAR
        run: |
          export $(grep -v '^#' .env | xargs)
          mvn -B -U clean package

      # 6️⃣ Run unit & integration tests with JaCoCo
      - name: Run tests with JaCoCo
        run: |
          export $(grep -v '^#' .env | xargs)
          mvn verify

      # 7️⃣ Upload Spring Boot JAR artifact
      - name: Upload Spring Boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar

      # 8️⃣ Upload JaCoCo report
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # 9️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t app:latest .

      # 🔟 Scan Docker image with Trivy
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:latest

      # 11️⃣ Build all services from docker-compose.yml
      - name: Build Docker Compose services
        run: docker compose -f docker-compose.yml build

      # 12️⃣ Start all services in detached mode
      - name: Start Docker Compose services
        run: docker compose -f docker-compose.yml up -d

      # 13️⃣ Wait for app service to be ready
      - name: Wait for App service
        run: |
          echo "Waiting for app to start..."
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "App is up!"
              break
            fi
            sleep 2
          done

      # 14️⃣ Smoke test: check if app is listening on 8080
      - name: Smoke Test App
        run: |
          if ! nc -z localhost 8080; then
            echo "ERROR: App not listening on 8080"
            docker compose -f docker-compose.yml logs app
            exit 1
          fi
          echo "Smoke test passed: App is listening on 8080"

      # 15️⃣ Tear down all services
      - name: Stop Docker Compose services
        if: always()
        run: docker compose -f docker-compose.yml down

      # 16️⃣ Remove temporary .env file
      - name: Cleanup .env
        if: always()
        run: rm -f .env
