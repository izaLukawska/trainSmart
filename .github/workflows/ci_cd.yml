name: CI/CD Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_HOST: db
      DB_PORT: 5432

    steps:
      # Checkout repo
      - uses: actions/checkout@v3

      # Set up JDK 21 + Maven cache
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      # Start PostgreSQL (Docker Compose)
      - name: Start PostgreSQL service
        run: |
          docker-compose up -d db
          echo "Waiting for PostgreSQL to start..."
          for i in {1..15}; do
            if docker exec $(docker ps -qf "name=db") pg_isready -U $DB_USER; then
              echo "PostgreSQL is ready!"
              break
            fi
            sleep 2
          done

      # Build Maven project
      - name: Build JAR
        run: mvn -B -U clean package -Pci

      # Run unit + integration tests
      - name: Run tests with JaCoCo
        run: mvn verify -Pci

      # Stop Docker Compose
      - name: Stop Docker Compose
        if: always()
        run: docker-compose down

      # Check dependency updates
      - name: Check dependency updates
        run: mvn versions:display-dependency-updates

      # Upload artifacts: JAR, JaCoCo, Dependency-Check
      - name: Upload Spring Boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/

      # Build Docker image (multi-stage)
      - name: Build Docker image
        run: docker build -t app:latest .

      # Scan Docker image with Trivy
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:latest

      # Run Docker Compose (smoke test)
      - name: Run Docker Compose (smoke test)
        run: |
          docker-compose up -d
          sleep 15
          if ! nc -z localhost 8080; then
            echo "ERROR: Application not listening on port 8080"
            docker-compose logs
            exit 1
          fi
          docker-compose down
