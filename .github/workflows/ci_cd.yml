name: CI/CD Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v3

      # 2️⃣ Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # 3️⃣ Create temporary .env for Docker Compose
      - name: Create temporary .env
        run: |
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=5432" >> .env

      # 4️⃣ Setup Java and Maven cache
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      # 5️⃣ Build Maven project (pass secrets as Maven properties)
      - name: Build JAR
        run: |
          mvn -B -U clean package \
            -DDB_USER="${{ secrets.DB_USER }}" \
            -DDB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -DDB_NAME="${{ secrets.DB_NAME }}" \
            -DDB_HOST=db \
            -DDB_PORT=5432

      # 6️⃣ Run tests with JaCoCo (pass secrets as Maven properties)
      - name: Run tests with JaCoCo
        run: |
          mvn verify \
            -DDB_USER="${{ secrets.DB_USER }}" \
            -DDB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -DDB_NAME="${{ secrets.DB_NAME }}" \
            -DDB_HOST=db \
            -DDB_PORT=5432

      # 7️⃣ Upload artifacts
      - name: Upload Spring Boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # 8️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t app:latest .

      # 9️⃣ Scan Docker image
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:latest

      # 🔟 Build Docker Compose services
      - name: Build Docker Compose services
        run: docker compose -f docker-compose.yml build

      # 11️⃣ Start Docker Compose services
      - name: Start Docker Compose services
        run: docker compose -f docker-compose.yml up -d

      # 12️⃣ Wait for PostgreSQL to be ready
      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec $(docker ps -qf "name=db") pg_isready -U ${{ secrets.DB_USER }} > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            sleep 2
          done

      # 13️⃣ Smoke test the app
      - name: Smoke Test App
        run: |
          echo "Waiting for app to start..."
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "App is up!"
              break
            fi
            sleep 2
          done

          if ! nc -z localhost 8080; then
            echo "ERROR: App not listening on 8080"
            docker compose -f docker-compose.yml logs app
            exit 1
          fi

          echo "Smoke test passed: App is listening on 8080"

      # 14️⃣ Tear down all services
      - name: Stop Docker Compose services
        if: always()
        run: docker compose -f docker-compose.yml down

      # 15️⃣ Remove temporary .env
      - name: Cleanup .env
        if: always()
        run: rm -f .env
