name: CI/CD Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_HOST: db
      DB_PORT: 5432

    steps:
      # Checkout repo
      - uses: actions/checkout@v3

      # Set up JDK 21 + Maven cache
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      # Build Maven project
      - name: Build JAR
        run: mvn -B -U clean package

      # Run unit & integration tests with JaCoCo
      - name: Run tests with JaCoCo
        run: mvn verify

      # Upload artifacts
      - name: Upload Spring Boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # Build Docker image
      - name: Build Docker image
        run: docker build -t app:latest .

      # Scan Docker image
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:latest

      # Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker compose

      # Build all services defined in docker-compose.yml
      - name: Build Docker Compose services
        run: docker compose -f docker-compose.yml build

      # Start all services
      - name: Start Docker Compose services
        run: docker compose -f docker-compose.yml up -d

      # Wait for app service to be ready
      - name: Wait for App service
        run: |
          echo "Waiting for app to start..."
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "App is up!"
              break
            fi
            sleep 2
          done

      # Smoke test: check if app is listening
      - name: Smoke Test App
        run: |
          if ! nc -z localhost 8080; then
            echo "ERROR: App not listening on 8080"
            docker-compose logs app
            exit 1
          fi
          echo "Smoke test passed: App is listening on 8080"

      # Tear down all services
      - name: Stop Docker Compose services
        if: always()
        run: docker compose -f docker-compose.yml down
