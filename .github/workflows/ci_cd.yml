name: CI/CD Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      # Checkout repo
      - uses: actions/checkout@v3

      # Set up JDK 21 + Maven cache
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      # Start PostgreSQL (bez docker-compose)
      - name: Start PostgreSQL container
        run: |
          docker run -d \
            --name postgres-test \
            -e POSTGRES_USER=$DB_USER \
            -e POSTGRES_PASSWORD=$DB_PASSWORD \
            -e POSTGRES_DB=$DB_NAME \
            -p 5432:5432 \
            postgres:17
          echo "Waiting for PostgreSQL to start..."
          for i in {1..10}; do
            if docker exec postgres-test pg_isready -U $DB_USER > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting..."
            sleep 3
          done

      # Build Maven project
      - name: Build JAR
        run: mvn -B -U clean package

      # Run unit & integration tests
      - name: Run tests with JaCoCo
        run: mvn verify

      # Stop PostgreSQL
      - name: Stop PostgreSQL
        if: always()
        run: docker stop postgres-test && docker rm postgres-test

      # Upload artifacts
      - name: Upload Spring Boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # Build Docker image (optional)
      - name: Build Docker image
        run: docker build -t app:latest .

      # Scan Docker image
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:latest

      # Smoke test (optional)
      - name: Run Docker container smoke test
        run: |
          docker run -d -p 8080:8080 --name app-test \
            -e DB_USER=$DB_USER \
            -e DB_PASSWORD=$DB_PASSWORD \
            -e DB_NAME=$DB_NAME \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=$DB_PORT \
            app:latest
          sleep 15
          if ! nc -z localhost 8080; then
            echo "ERROR: App not listening on 8080"
            docker logs app-test
            exit 1
          fi
          docker stop app-test && docker rm app-test
