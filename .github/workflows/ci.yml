name: Build, Test with Coverage and Docker Smoke Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21 with caching
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'

      - name: Set environment variables
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> $GITHUB_ENV
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> $GITHUB_ENV
          echo "DB_USER=${{ secrets.DB_USER }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV

      - name: Build project
        run: mvn -pl app -am -B -U -DskipTests package -Dspring-boot.repackage.skip=false

      - name: Run tests and check coverage
        run: mvn verify

      - name: Upload Jacoco Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/index.html'

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'

      - name: Upload JAR Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifacts
          path: '**/target/*.jar'

  smoke-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 with caching
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'

      - name: Generate .env from secrets
        run: |
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_PORT=${{ secrets.DB_DOCKER_PORT }}" >> .env
          echo "DB_HOST=${{ secrets.DB_DOCKER_HOST }}" >> .env

      - name: Download JAR artifacts from build job
        uses: actions/download-artifact@v4
        with:
          name: jar-artifacts
          path: app/target

      - name: Show downloaded JARs (debug)
        run: |
          echo "Listing app/target"
          ls -la app/target || true
          echo "If empty, list workspace root:"
          ls -la || true

      - name: Inspect downloaded JAR manifest
        run: |
          echo "Inspecting JAR manifest..."
          if ! unzip -p app/target/*.jar META-INF/MANIFEST.MF >/tmp/manifest 2>/dev/null; then
            echo "ERROR: cannot read META-INF/MANIFEST.MF from app/target/*.jar"
            ls -l app/target/*.jar || true
            exit 1
          fi
          
          echo "Manifest contents:"
          cat /tmp/manifest
          
          if ! grep -E '^(Main-Class|Start-Class):' /tmp/manifest >/dev/null; then
            echo "ERROR: JAR is not executable (missing Main-Class or Start-Class)"
            echo "Listing JAR contents for debug:"
            unzip -l app/target/*.jar | head -n 50
            exit 1
          fi

      - name: Build and start services
        run: docker compose --env-file .env up -d --build

      - name: Smoke test (healthcheck)
        run: |
          echo "Waiting for containers to initialize..."
          sleep 5
          
          MAX_ATTEMPTS=24
          URL="http://localhost:8080/actuator/health"
          
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i/$MAX_ATTEMPTS"
            docker compose ps
            if curl -sSf --max-time 3 $URL > /dev/null; then
              echo "Application run successfully"
              docker compose down --volumes --remove-orphans
              exit 0
            fi
          
            echo "Health endpoint not ready yet - last logs:"
            docker compose logs --tail 50
            sleep 5
          done
          
          echo "Application failed to become healthy after $((MAX_ATTEMPTS*5))s"
          docker compose logs
          docker compose down --volumes --remove-orphans
          exit 1
