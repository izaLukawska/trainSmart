openapi: 3.0.3
info:
  title: Exercise catalog API
  version: 1.0.0
tags:
  - name: Exercise
    description: Exercise endpoints

paths:
  /exercises:
    post:
      tags:
        - Exercise
      operationId: createExercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseRequest'
      responses:
        "201":
          description: Exercise created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (requires ADMIN role)
  /exercises/name:
    get:
      tags:
        - Exercise
      operationId: getExerciseByName
      parameters:
        - name: name
          in: query
          description: Exercise name
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Exercise found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        "400":
          description: Invalid request
        "404":
          description: Exercise not found
  /exercises/muscle-group:
    get:
      tags:
        - Exercise
      operationId: getExercisesByMuscleGroup
      parameters:
        - name: muscleGroup
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/MuscleGroupEnum'
      responses:
        "200":
          description: List of exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseResponse'
        "400":
          description: Invalid request
        "404":
          description: No exercises found

components:
  schemas:
    MuscleGroupEnum:
      type: string
      enum:
        - QUADS
        - HAMSTRINGS
        - CHEST
        - SHOULDERS
        - BACK
        - ABS
    ExerciseTypeEnum:
      type: string
      enum:
        - BARBELL
        - BODYWEIGHT
        - DUMBBELL
        - KETTLEBELL
        - OTHER
    ExerciseRequest:
      type: object
      required:
        - name
        - muscleGroup
        - exerciseType
      properties:
        name:
          type: string
          minLength: 1
        muscleGroup:
          $ref: '#/components/schemas/MuscleGroupEnum'
        exerciseType:
          $ref: '#/components/schemas/ExerciseTypeEnum'
    ExerciseResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
