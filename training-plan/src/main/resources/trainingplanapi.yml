openapi: 3.0.3
info:
  title: Training Plan API
  version: 1.0.0
tags:
  - name: UserExercise
    description: User exercise endpoints
  - name: TrainingPlan
    description: Training plan endpoints
paths:
  /users/{userId}/exercises:
    get:
      tags:
        - UserExercise
      operationId: getUserExerciseByUserIdAndExerciseName
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: name
          in: query
          required: true
          description: Exercise name to look up (use `?name=back squat`)
          schema:
            type: string
            example: "back squat"
      responses:
        '200':
          description: Found exercise for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExerciseResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'
        '404':
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
  /users/{userId}/exercises/all:
    get:
      tags:
        - UserExercise
      operationId: getAllUserExercisesByUserId
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: pagingRequest
          in: query
          explode: true
          schema:
            $ref: '#/components/schemas/PagingRequest'
        - name: filterRequest
          in: query
          explode: true
          schema:
            $ref: '#/components/schemas/UserExerciseFilterRequest'
      responses:
        '200':
          description: Paged slice of user exercises
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SliceUserExerciseResponse'
        '400':
          description: Bad request (validation failed)
        '404':
          description: User not found
  /users/user/{userId}/training-plans:
    get:
      tags:
        - TrainingPlan
      operationId: getTrainingPlanByIdAndUserId
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: planId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Training plan details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanResponse'


components:
  schemas:
    AssignedDayEnum:
      type: string
      enum:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
    IntensityLevelEnum:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
      example: MEDIUM
    TrainingTypeEnum:
      type: string
      enum:
        - STRENGTH
        - HYPERTROPHY
        - ENDURANCE
    PlanDurationEnum:
      enum:
        - FOUR_WEEKS
        - EIGHT_WEEKS
        - TWELVE_WEEKS
    MuscleGroupEnum:
      type: string
      enum:
        - CHEST
        - HAMSTRINGS
        - QUADS
        - SHOULDERS
        - ABS
        - BACK
    ExerciseTypeEnum:
      type: string
      enum:
        - BARBELL
        - BODYWEIGHT
        - DUMBBELL
        - KETTLEBELL
        - OTHER
    TrainingPlanResponse:
      type: object
      required:
        - planId
        - trainingType
        - planDuration
        - trainingWeeks
      properties:
        planId:
          type: integer
          format: int64
        trainingType:
          $ref: '#/components/schemas/TrainingTypeEnum'
        planDuration:
          $ref: '#/components/schemas/PlanDurationEnum'
    TrainingWeekResponse:
      type: object
      required:
        - weekId
        - weekIndex
        - trainingBlocks
      properties:
        weekId:
          type: integer
          format: int64
        weekIndex:
          type: integer
        trainingBlocks:
          type: array
          items:
            $ref: '#/components/schemas/TrainingBlockResponse'
    TrainingBlockResponse:
      type: object
      required:
        - blockId
        - assignedDay
        - blockExercises
      properties:
        blockId:
          type: integer
          format: int64
        assignedDay:
          $ref: '#/components/schemas/AssignedDayEnum'
        blockExercises:
          type: array
          items:
            $ref: '#/components/schemas/BlockExerciseResponse'
    BlockExerciseResponse:
      type: object
      required:
        - exerciseName
        - reps
        - sets
        - intensity
        - loadPercent
      properties:
        exerciseName:
          type: string
        reps:
          type: integer
        sets:
          type: integer
        intensityLevel:
          $ref: '#/components/schemas/IntensityLevelEnum'
        loadPercent:
          type: string
          description: "Internally stored as a Double (0.78), but returned as a formatted percentage string."
          x-field-extra-annotation: "@com.fasterxml.jackson.databind.annotation.JsonSerialize(
          using = org.lukawska.trainsmart.trainingplan.application.serializer.LoadPercentageSerializer.class)"
          example: "78%"


    PagingRequest:
      type: object
      properties:
        pageNumber:
          type: integer
          default: 0
          minimum: 0
        pageSize:
          type: integer
          default: 20
          minimum: 5
        sortBy:
          type: string
          enum:
            - id
            - name
            - lastUsedAt
          x-enum-varnames:
            - ID
            - NAME
            - LAST_USED_AT
        direction:
          type: string
          enum:
            - ASC
            - DESC
          default: ASC
    UserExerciseFilterRequest:
      type: object
      properties:
        enabled:
          type: boolean
          nullable: true
        muscleGroup:
          allOf:
            - $ref: '#/components/schemas/MuscleGroupEnum'
          nullable: true
        exerciseType:
          allOf:
            - $ref: '#/components/schemas/ExerciseTypeEnum'
          nullable: true
    SliceUserExerciseResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserExerciseResponse'
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        last:
          type: boolean
    UserExerciseResponse:
      type: object
      required:
        - id
        - exerciseName
        - enabled
        - lastUsedAt
      properties:
        id:
          type: integer
          format: int64
          example: 123
        exerciseName:
          type: string
          example: "back squat"
        enabled:
          type: boolean
          example: true
        lastUsedAt:
          type: string
          format: date-time
          x-java-type: java.time.Instant
          example: "2025-01-01T12:00:00Z"
    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - instance
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        instance:
          type: string
          format: uri
    BadRequestProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          additionalProperties:
            type: string
          example:
            type: "about:blank"
            title: "Validation failure"
            status: 400
            instance: "/api/v1/current-endpoint-path"
            name: "size must be between 1 and 2147483647"
    UnauthorizedProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          additionalProperties:
            type: string
          example:
            type: "about:blank"
            title: "User management exception"
            status: 401
            detail: "Invalid token"
            instance: "/api/v1/current-endpoint-path"
    NotFoundProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          additionalProperties:
            type: string
          example:
            type: "about:blank"
            title: "Exercise exception"
            status: 404
            detail: "Exercise not found"
            instance: "/api/v1/current-endpoint-path"
    ConflictProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          additionalProperties:
            type: string
          example:
            type: "about:blank"
            title: "Exercise exception"
            status: 409
            detail: "Exercise already exists"
            instance: "/api/v1/current-endpoint-path"
