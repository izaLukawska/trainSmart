spring:
  test:
    database:
      replace: NONE
  jpa:
    hibernate:
      ddl-auto: create
  mail:
    protocol: smtp
app:
  mailing:
    from: test-from@example.com
    reply-to: test-replyto@example.com
    validMimeTypes:
      pdf:
        - application/pdf
    maxSizeBytes: 10485760
  jwt:
    secret: ${JWT_SECRET}
    accessExpMs: 3600000
    refreshExpMs: 86400000

