spring:
  application:
    name: trainSmart
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000

mailing:
  from: no-reply@trainsmart.com
  reply-to: support@trainsmart.com
  validMimeTypes:
    pdf:
      - application/pdf
      - application/x-pdf
    xls:
      - application/vnd.ms-excel
    xlsx:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  maxSizeBytes: 10485760
