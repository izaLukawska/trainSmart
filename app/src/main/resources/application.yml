spring:
  application:
    name: trainSmart
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2000ms
        multiplier: 2
        max-interval: 2000ms
      on-client-errors: false
      exclude-on-http-codes: [ 400, 401, 403 ]
      on-http-codes: [ 429, 500, 503, 502, 504 ]
    openai:
      api-key: ${OPEN_AI_KEY}
      chat:
        options:
          model: gpt-4o-mini
          max-tokens: 500
          temperature: 0.0
