spring:
  application:
    name: trainSmart
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    openai:
      api-key: key
      chat:
        options:
          model: gpt-4o-mini
          max-tokens: 500
          response-format: json_object
