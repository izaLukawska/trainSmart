spring:
  application:
    name: trainSmart
  web:
    locale: en
    locale-resolver: accept_header
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  config:
    import: optional:classpath:statements.yml
  mvc:
    problemdetails:
      enabled: true
    servlet:
      path: /api/v1
